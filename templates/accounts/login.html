<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartCart AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/static/css/smartcart.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-white rounded-xl shadow-md p-8 m-4">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900">SmartCart <span class="text-indigo-600">AI</span></h1>
            <p class="text-sm text-gray-500">Sign in to manage your budget and cart</p>
        </div>

        {% if form.errors %}
            <div class="bg-red-50 border-l-4 border-red-400 p-4 mb-6 text-sm text-red-700">
                Your username and password didn't match. Please try again.
            </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% elif next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}
            <div>

                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
                Sign In
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-600">
            Don't have an account? <a href="{% url 'register' %}" class="text-indigo-600 font-medium hover:underline">Register here</a>
        </p>
    </div>
</body>
</html>
