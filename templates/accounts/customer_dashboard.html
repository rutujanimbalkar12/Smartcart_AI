<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - SmartCart AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/smartcart.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    {% include 'products/navbar.html' %}

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow p-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Customer Dashboard</h2>
            <p class="text-gray-600">Welcome, {{ request.user.username }}. Choose where you want to go next.</p>
            <div class="mt-4 d-flex flex-wrap gap-2">
                <a href="{% url 'product_list' %}" class="btn btn-primary">Browse Products</a>
                <a href="{% url 'view_cart' %}" class="btn btn-outline-primary">View Cart</a>
                <a href="{% url 'list_management' %}" class="btn btn-outline-secondary">Shopping Lists</a>
                <a href="{% url 'budget_view' %}" class="btn btn-outline-success">Budget</a>
                <a href="{% url 'customer_profile' %}" class="btn btn-outline-dark">My Profile</a>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
