<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Dashboard - SmartCart AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/smartcart.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'products/navbar.html' %}
    <main class="container py-4">
        <div class="card shadow-sm p-4">
            <h3>Store Dashboard</h3>
            <p class="text-muted">Manage your selected store and continue shopping.</p>
            <div class="mt-3 d-flex flex-wrap gap-2">
                <a href="{% url 'store_selection' %}" class="btn btn-primary">Choose Store</a>
                <a href="{% url 'product_list' %}" class="btn btn-outline-primary">View Products</a>
                <a href="{% url 'list_management' %}" class="btn btn-outline-secondary">My Shopping Lists</a>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
