<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Store - SmartCart AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/smartcart.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'products/navbar.html' %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm p-4">
                    <h2 class="mb-4 text-center">Select Your Supermarket</h2>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="store_id" class="form-label">Choose a nearby store:</label>
                            <select name="store_id" id="store_id" class="form-select" required>
                                <option value="" disabled selected>Select a store...</option>
                                {% for store in stores %}
                                    <option value="{{ store.id }}">{{ store.name }} - {{ store.location }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Continue to Products</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
