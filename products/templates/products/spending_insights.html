<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Spending Insights - SmartCart AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/smartcart.css" rel="stylesheet">
</head>
<body class="bg-light">
    {% include 'products/navbar.html' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <div class="container my-5" style="max-width: 800px;">
        <div class="d-flex align-items-center mb-3">
            <span class="sc-kicker me-2">AI INSIGHTS</span>
            <div>
                <h2 class="mb-0">AI Personal Shopping Advisor</h2>
                <p class="text-muted mb-0">Automated intelligence insights based on your purchase history and store inventory.</p>
            </div>
        </div>

        <div class="row row-cols-1 g-3">
            {% for insight in insights %}
                <div class="col">
                    <div class="card shadow-sm bg-white border-start border-4 border-{{ insight.badge_color }}">
                        <div class="card-body d-flex align-items-start">
                            <span class="fs-3 me-3">{{ insight.icon }}</span>
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="badge bg-{{ insight.badge_color }} text-dark bg-opacity-10 text-{{ insight.badge_color }} border border-{{ insight.badge_color }}">
                                        {{ insight.category }}
                                    </span>
                                </div>
                                <p class="mb-0 fs-6 text-dark">{{ insight.message }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
